name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Live Jev evaluation is intentionally not run in CI. The mock backend proves the pipeline.
      - run: pnpm jevcraft evaluate datasets/fixtures --backend mock --out /tmp/ci-decisions.jsonl
      # The session-level datasets are gitignored, so the figures are re-rendered from the
      # committed aggregates in docs/figure-data.json. This fails if the SVGs have drifted.
      - run: pnpm figures
      - run: git diff --exit-code -- docs/images

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test build --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: JevCraft-plugin-jar
          path: plugin/build/libs/*.jar
