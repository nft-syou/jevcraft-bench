<text x="212.0" y="342.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="end">JevCraft policy</text>
<text x="212.0" y="359.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="end">Jev answers plus the policy</text>
<rect x="235.0" y="320.0" width="157.3" height="50" rx="5" fill="rgb(117,169,229)" stroke="#d8dee4" stroke-width="1"/>
<text x="313.7" y="351.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">80%</text>
<rect x="402.3" y="320.0" width="157.3" height="50" rx="5" fill="rgb(152,190,236)" stroke="#d8dee4" stroke-width="1"/>
<text x="481.0" y="351.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">60%</text>
<rect x="569.7" y="320.0" width="157.3" height="50" rx="5" fill="rgb(140,183,234)" stroke="#d8dee4" stroke-width="1"/>
<text x="648.3" y="351.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">67%</text>
<text x="24.0" y="408.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="start">Ore counting handles the greedy wanderer and misses the throttled cheat; approach directness does the reverse.</text>
<text x="24.0" y="428.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="start">With five to fifteen sessions per style, no single cell difference is statistically significant.</text>
