<rect x="569.7" y="196.0" width="157.3" height="50" rx="5" fill="rgb(255,255,255)" stroke="#d8dee4" stroke-width="1"/>
<text x="648.3" y="227.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">0%</text>
<text x="212.0" y="280.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="end">approach directness</text>
<text x="212.0" y="297.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="end">from this project's telemetry</text>
